name: Setup toolchain
description: Install pnpm and Node (with the pnpm store cached) and the workspace dependencies.

inputs:
  cache:
    description: >-
      Cache the pnpm store between runs. A release job turns this off: what it publishes must
      not depend on anything restored from a cache that other runs could have written.
    default: 'true'

runs:
  using: composite
  steps:
    # The pnpm version comes from the root package.json "packageManager" field, so
    # there is nothing to pin here. Third-party actions are pinned to a commit SHA
    # (the comment names the release); Dependabot keeps both in step.
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: ${{ inputs.cache }}

    - name: Install Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        package-manager-cache: ${{ inputs.cache }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
