version: 2

updates:
  # pnpm workspace — Dependabot resolves the whole monorepo (including the
  # pnpm-workspace.yaml catalog:/catalogs: entries) from the root directory;
  # no per-package directory entries are needed.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    # Plugin package.json "version" fields stay pinned at 0.0.0 (CLAUDE.md,
    # "Plugins version only their manifest.json") — Dependabot only ever
    # touches dependency ranges, never that field, so no extra config is
    # needed to protect it.
    # Majors that are deliberate migrations, not dependency bumps — each has
    # an epic task and a reason a bot PR can't merge it (2026-09-06 triage):
    #   typescript — catalog-pinned ^5.9; TS 6 changed @types/node pickup
    #                (epic task 0.28)
    #   next       — Next 16 defaults to Turbopack; @ducanh2912/next-pwa is a
    #                webpack plugin (epic task 0.27)
    #   @types/node — tracks the root `engines` major (24), not the newest
    #                Node release
    ignore:
      # better-auth 1.7.0–1.7.2 add a required `account.issuer` column that the
      # migrator refuses to add to any populated table (UnsafeMigrationError at
      # auth boot), and better-auth's own 1.7 upgrade guide says 1.7.3 removes
      # it again and tells operators to drop it by hand. Skip the window; the
      # bot may propose 1.7.3+ (epic task 1.26 holds the re-entry checklist).
      - dependency-name: 'better-auth'
        versions: ['>=1.7.0 <1.7.3']
      - dependency-name: '@better-auth/passkey'
        versions: ['>=1.7.0 <1.7.3']
      - dependency-name: '@better-auth/oauth-provider'
        versions: ['>=1.7.0 <1.7.3']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # better-sqlite3-multiple-ciphers 13 dropped the type declarations v12
      # shipped (packages/db typecheck + dts build fail). It is a native addon
      # whose only consumers are the one-time legacy migration readers and the
      # backup CLI — low value, real ABI risk; take it deliberately (2026-09-06
      # triage, #643).
      - dependency-name: 'better-sqlite3-multiple-ciphers'
        update-types: ['version-update:semver-major']
    groups:
      # better-auth minors change persisted schema and the signed session
      # cookie-cache format the runtime middleware verifies offline (1.6→1.7
      # broke both, found in a grouped bump) — never ride along in the
      # routine batch; own PR, own live verification (epic task 1.26).
      better-auth:
        patterns:
          - 'better-auth'
          - '@better-auth/*'
      # Next.js patches change framework behavior the SDK depends on — 15.5.25
      # changed what `headers()` does outside a request scope, which the
      # sdk.storage/sdk.env/sdk.db background-invocation fallbacks catch —
      # so a Next bump gets its own PR and its own verification, never the
      # routine batch (2026-09-06 triage, #642).
      next:
        patterns:
          - 'next'
          - '@next/*'
      # Batch routine patch/minor bumps into fewer PRs; a major bump always
      # gets its own PR regardless of grouping, since it may be breaking.
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - 'better-auth'
          - '@better-auth/*'
          - 'next'
          - '@next/*'

  # Workflow action versions (actions/checkout@vN, etc.) — separate ecosystem,
  # same weekly cadence.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'ci'
