name: App release

# Shared by every app of the suite (research 0007), called by the app's own .github/workflows/release.yml at a pinned commit of this
# repository when a promotion pull request (develop -> main) is merged. A title that starts with `Release` is checked again against the
# merged code, with the app's own pinned @sovereignfs/create, and the merge commit is tagged with the app's version; the tag is the
# workflow's output, and the app's release.yml then calls its own publish workflow with it (a tag made with this run's token starts no
# workflow by itself). A title without `Release` tags nothing.
on:
  workflow_call:
    inputs:
      directory:
        description: The app's folder in its repository, where its package.json is; `.` for an app at the root.
        type: string
        required: false
        default: '.'
      tag-prefix:
        description: What the app's tags start with before the `v`, such as `web-`; empty for `vX.Y.Z`.
        type: string
        required: false
        default: ''
    outputs:
      tag:
        description: The tag made on the merge commit, or empty when nothing is released.
        value: ${{ jobs.plan.outputs.tag }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.title, 'Release')
    permissions:
      # To make the tag.
      contents: write
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - id: create
        name: Find the app's @sovereignfs/create
        env:
          DIR: ${{ inputs.directory }}
        run: |
          version="$(node -p "require(require('node:path').resolve(process.env.DIR, 'package.json')).devDependencies?.['@sovereignfs/create'] ?? ''")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$DIR/package.json must pin @sovereignfs/create to an exact version among its devDependencies (it is \"$version\")."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: plan
        name: Check the title against the merged code
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          DIR: ${{ inputs.directory }}
          PREFIX: ${{ inputs.tag-prefix }}
          CREATE: ${{ steps.create.outputs.version }}
        run: npm exec --yes --package="@sovereignfs/create@$CREATE" -- create release check --dir "$DIR" --prefix "$PREFIX" --github-output

      - name: Tag the merge commit
        if: steps.plan.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$MERGE_SHA" --silent
          echo "Tagged $TAG on $MERGE_SHA."
