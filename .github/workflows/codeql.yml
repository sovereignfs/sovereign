name: CodeQL

# Static analysis (SAST) for the JS/TS codebase. Runs on pushes to `main`, on
# every pull request, and on a weekly schedule so a newly-published query
# pack can surface an issue in code that hasn't changed. Separate from ci.yml
# — CodeQL's own runtime is independent of the format/lint/typecheck/build
# pipeline and shouldn't compete with or block it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  schedule:
    # Mondays 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'skip-ci'))
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: javascript-typescript
          # No build needed — CodeQL's JS/TS extractor works from source,
          # not compiled output.
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.3
        with:
          category: '/language:javascript-typescript'
