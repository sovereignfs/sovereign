name: E2E

# Playwright runs as a reusable pre-publish gate for root release tags. Image
# publishing must not proceed if the browser golden paths fail.
on:
  workflow_call:
    secrets:
      E2E_AUTH_SECRET:
        required: true
      E2E_ADMIN_KEY:
        required: true

jobs:
  e2e:
    name: Playwright golden paths
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Reuse the shared pnpm + Node setup from the CI pipeline.
      - uses: ./.github/actions/setup

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Build workspace packages (SDK, UI, manifest, db, mailer) so the apps can
      # import them. The runtime and auth apps are started by Playwright's webServer
      # in dev mode — no full `next build` needed.
      - name: Build workspace packages
        run: pnpm turbo build --filter='./packages/*'

      # sovereign.plugins.json is a local, gitignored file (epic task 3.31) —
      # the checkout has none, so install:plugins would otherwise fall back to
      # sovereign.plugins.default.json (Sovereign Tasks only). Declare exactly
      # what this job needs instead:
      #   - example-basic: no spec exercises it directly, but it's required to
      #     keep launcher.spec.ts's generic "click the first tile" test
      #     passing. The launcher grid sorts installed plugins alphabetically
      #     by manifest id (scripts/generate-registry.ts); without a plugin
      #     that sorts before "fs.sovereign.example-monetized", that paywalled
      #     plugin becomes the first tile and the test's plain-navigation
      #     assertion fails on the paywall redirect instead. example-basic
      #     ("...example-basic" < "...example-monetized") is a free,
      #     ungated plugin, so it restores the original assumption cheaply.
      #   - example-monetized: the paywall golden path exercises this plugin
      #     directly (see __tests__/e2e/paywall.spec.ts, global-setup.ts).
      #   - sovereign-healthlog: not exercised by any spec's UI flow, but kept
      #     deliberately for its `database.requireEncryption: true` manifest —
      #     boot-time regression coverage for the exact per-plugin encryption
      #     enforcement epic task 8.15 fixed (RFC 0071).
      - name: Declare plugins for e2e
        run: |
          cat > sovereign.plugins.json <<'EOF'
          {
            "plugins": [
              {
                "id": "example-basic",
                "repository": "https://github.com/sovereignfs/sovereign-plugins-examples.git",
                "ref": "40ab20ed9a46e129cf6efbd9d0164ea27ef8485a",
                "subdir": "example-basic"
              },
              {
                "id": "example-monetized",
                "repository": "https://github.com/sovereignfs/sovereign-plugins-examples.git",
                "ref": "40ab20ed9a46e129cf6efbd9d0164ea27ef8485a",
                "subdir": "example-monetized"
              },
              {
                "id": "sovereign-healthlog",
                "repository": "https://github.com/sovereignfs/sovereign-healthlog.git",
                "ref": "v0.2.0"
              }
            ]
          }
          EOF

      # Clone the declared plugins at their pinned ref, then compose all
      # plugin routes so `next dev` starts cleanly. install:plugins runs
      # generate itself once it clones. The cloned plugins are intentionally
      # absent from the committed lockfile, so refresh the CI workspace graph
      # after materializing them instead of disabling pnpm's dependency
      # verification for the test command.
      - name: Install and compose plugins
        run: |
          pnpm install:plugins
          pnpm install --no-frozen-lockfile

      # Write a minimal .env for both apps. Secrets must be set in the repo's
      # Settings → Secrets and variables → Actions.
      # E2E_AUTH_SECRET: any stable base64 string (openssl rand -base64 32)
      # E2E_ADMIN_KEY: any string used as the sovereign admin key
      #
      # SOVEREIGN_DB_ENCRYPTION_KEY is generated fresh per run, not a stored
      # secret — the checkout (and its data/ dir) is ephemeral per job, so
      # there's nothing to decrypt across runs and no key to persist. Set here
      # so sovereign-healthlog (declared above, `database.requireEncryption:
      # true`, RFC 0071) actually gets encrypted rather than just warning
      # (epic task 8.15 — a missing key no longer blocks the whole platform's
      # boot, only that one plugin runs unencrypted). The webServer starts
      # against a brand-new, empty data/ dir, so the key-set-before-first-boot
      # path applies (no `sv db encrypt` migration step needed).
      - name: Write .env
        run: |
          {
            echo "AUTH_SECRET=${{ secrets.E2E_AUTH_SECRET }}"
            echo "SOVEREIGN_AUTH_SECRET=${{ secrets.E2E_AUTH_SECRET }}"
            echo "SOVEREIGN_ADMIN_KEY=${{ secrets.E2E_ADMIN_KEY }}"
            echo "SOVEREIGN_DB_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "SOVEREIGN_AUTH_URL=http://localhost:3001"
            echo "SOVEREIGN_AUTH_PUBLIC_URL=http://localhost:3001"
            echo "NEXT_PUBLIC_RUNTIME_URL=http://localhost:3000"
            echo "AUTH_INVITE_ONLY=false"
            echo "SOVEREIGN_EXAMPLES_ENABLED=true"
          } >> .env

      - name: Run Playwright tests
        run: pnpm test:e2e
        env:
          CI: 'true'

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
