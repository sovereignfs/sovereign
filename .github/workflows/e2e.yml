name: E2E

# Playwright runs as a reusable pre-publish gate for root release tags. Image
# publishing must not proceed if the browser golden paths fail.
on:
  workflow_call:
    secrets:
      E2E_AUTH_SECRET:
        required: true
      E2E_ADMIN_KEY:
        required: true

jobs:
  e2e:
    name: Playwright golden paths
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Reuse the shared pnpm + Node setup from the CI pipeline.
      - uses: ./.github/actions/setup

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Build workspace packages (SDK, UI, manifest, db, mailer) so the apps can
      # import them. The runtime and auth apps are started by Playwright's webServer
      # in dev mode — no full `next build` needed.
      - name: Build workspace packages
        run: pnpm turbo build --filter='./packages/*'

      # sovereign.plugins.json is a local, gitignored file (epic task 3.31) —
      # the checkout has none, so install:plugins would otherwise fall back to
      # sovereign.plugins.default.json (empty — platform plugins only). Declare
      # exactly what this job needs instead:
      #   - sovereign-plugin-healthlog: not exercised by any spec's UI flow,
      #     but kept deliberately for its `database.requireEncryption: true`
      #     manifest — boot-time regression coverage for the exact per-plugin
      #     encryption enforcement epic task 8.15 fixed (RFC 0071). Pinned to
      #     v0.2.2, not the older v0.2.0/v0.2.1 — those still declared the
      #     manifest `database.dialect` field task 8.22 removed from the
      #     schema, which the current (stricter, unrecognized-key-rejecting)
      #     validation fails outright, not just for this fixture but for any
      #     real deployment composing that plugin. Every published tag of
      #     this plugin before v0.2.2 is broken against platform builds past
      #     task 8.22; don't pin back to one.
      #   - example-basic and example-monetized are NOT declared here: they
      #     live in-repo under `example-plugins/` (`docs/epics/example-plugins.md`,
      #     2026-08-01 correction) and are composed automatically by the
      #     `SOVEREIGN_EXAMPLES_ENABLED=true` env var set below, once the
      #     runtime dev server (started by Playwright's webServer) picks up
      #     the .env written in a later step. example-basic keeps
      #     launcher.spec.ts's generic "click the first tile" test passing —
      #     the launcher grid sorts installed plugins alphabetically by
      #     manifest id, and without a plugin sorting before
      #     "fs.sovereign.example-monetized" that paywalled plugin becomes the
      #     first tile, breaking the test's plain-navigation assertion.
      #     example-monetized is exercised directly by the paywall golden path
      #     (see __tests__/e2e/paywall.spec.ts, global-setup.ts). Declaring
      #     them here too would double-compose them (once from `plugins/`,
      #     once from `example-plugins/`) and trip the duplicate-manifest-id
      #     guard in `scripts/generate-registry.ts`.
      - name: Declare plugins for e2e
        run: |
          cat > sovereign.plugins.json <<'EOF'
          {
            "plugins": [
              {
                "id": "sovereign-plugin-healthlog",
                "repository": "https://github.com/sovereignfs/sovereign-plugin-healthlog.git",
                "ref": "v0.2.2"
              }
            ]
          }
          EOF

      # Clone the declared plugins at their pinned ref, then compose all
      # plugin routes so `next dev` starts cleanly. install:plugins runs
      # generate itself once it clones. The cloned plugins are intentionally
      # absent from the committed lockfile, so refresh the CI workspace graph
      # after materializing them instead of disabling pnpm's dependency
      # verification for the test command.
      - name: Install and compose plugins
        run: |
          pnpm install:plugins
          pnpm install --no-frozen-lockfile

      # Write a minimal .env for both apps. Secrets must be set in the repo's
      # Settings → Secrets and variables → Actions.
      # E2E_AUTH_SECRET: any stable base64 string (openssl rand -base64 32)
      # E2E_ADMIN_KEY: any string used as the sovereign admin key
      #
      # SOVEREIGN_DB_ENCRYPTION_KEY is generated fresh per run, not a stored
      # secret — the checkout (and its data/ dir) is ephemeral per job, so
      # there's nothing to decrypt across runs and no key to persist. Set here
      # so sovereign-plugin-healthlog (declared above, `database.requireEncryption:
      # true`, RFC 0071) actually gets encrypted rather than just warning
      # (epic task 8.15 — a missing key no longer blocks the whole platform's
      # boot, only that one plugin runs unencrypted). The webServer starts
      # against a brand-new, empty data/ dir, so the key-set-before-first-boot
      # path applies (no `sv db encrypt` migration step needed).
      - name: Write .env
        run: |
          {
            echo "AUTH_SECRET=${{ secrets.E2E_AUTH_SECRET }}"
            echo "SOVEREIGN_AUTH_SECRET=${{ secrets.E2E_AUTH_SECRET }}"
            echo "SOVEREIGN_ADMIN_KEY=${{ secrets.E2E_ADMIN_KEY }}"
            echo "SOVEREIGN_DB_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "SOVEREIGN_AUTH_URL=http://localhost:3001"
            echo "SOVEREIGN_AUTH_PUBLIC_URL=http://localhost:3001"
            echo "NEXT_PUBLIC_RUNTIME_URL=http://localhost:3000"
            echo "AUTH_INVITE_ONLY=false"
            echo "SOVEREIGN_EXAMPLES_ENABLED=true"
          } >> .env

      - name: Run Playwright tests
        run: pnpm test:e2e
        env:
          CI: 'true'

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
