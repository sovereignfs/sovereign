name: E2E

# Playwright runs as a reusable pre-publish gate for root release tags. Image
# publishing must not proceed if the browser golden paths fail.
on:
  workflow_call:
    secrets:
      E2E_AUTH_SECRET:
        required: true
      E2E_ADMIN_KEY:
        required: true

jobs:
  e2e:
    name: Playwright golden paths
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Reuse the shared pnpm + Node setup from the CI pipeline.
      - uses: ./.github/actions/setup

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Build workspace packages (SDK, UI, manifest, db, mailer) so the apps can
      # import them. The runtime and auth apps are started by Playwright's webServer
      # in dev mode — no full `next build` needed.
      - name: Build workspace packages
        run: pnpm turbo build --filter='./packages/*'

      # sovereign.plugins.json is a local, gitignored file (epic task 3.31) —
      # the checkout has none, so install:plugins would otherwise fall back to
      # sovereign.plugins.default.json (empty — platform plugins only).
      #
      # No external plugin is declared here (previously sovereign-plugin-
      # healthlog was, pinned for its `database.requireEncryption: true`
      # manifest — boot-time regression coverage for the per-plugin encryption
      # enforcement epic task 8.15 fixed under RFC 0071). At-rest SQLite
      # encryption was retired entirely (see CLAUDE.md's architecture-rules
      # note and docs/incidents/2026-07-24-rfc-0071-encryption-rollout.md) —
      # the manifest `database` field no longer exists at all, so every
      # published healthlog tag (which still declares it) now fails the
      # stricter unrecognized-key-rejecting schema. There is nothing left in
      # the platform for that fixture to regression-test.
      #
      # example-basic and example-monetized are composed automatically by the
      # `SOVEREIGN_EXAMPLES_ENABLED=true` env var set below, once the runtime
      # dev server (started by Playwright's webServer) picks up the .env
      # written in a later step — no declaration needed here. example-basic
      # keeps launcher.spec.ts's generic "click the first tile" test passing —
      # the launcher grid sorts installed plugins alphabetically by manifest
      # id, and without a plugin sorting before "fs.sovereign.example-monetized"
      # that paywalled plugin becomes the first tile, breaking the test's
      # plain-navigation assertion. example-monetized is exercised directly by
      # the paywall golden path (see __tests__/e2e/paywall.spec.ts,
      # global-setup.ts).
      - name: Declare plugins for e2e
        run: |
          cat > sovereign.plugins.json <<'EOF'
          {
            "plugins": []
          }
          EOF

      # Clone the declared plugins at their pinned ref, then compose all
      # plugin routes so `next dev` starts cleanly. install:plugins runs
      # generate itself once it clones. The cloned plugins are intentionally
      # absent from the committed lockfile, so refresh the CI workspace graph
      # after materializing them instead of disabling pnpm's dependency
      # verification for the test command.
      - name: Install and compose plugins
        run: |
          pnpm install:plugins
          pnpm install --no-frozen-lockfile

      # SQLite is sqld-backed only now — DB_DIALECT is mandatory (no default)
      # and the "sqlite" branch needs a live server, same as ci.yml's own test
      # job. Not a `services:` container: sqld needs the `--enable-namespaces`
      # CLI flag, which the services block has no way to pass to a service
      # image's command — a plain `docker run` is the documented workaround.
      # Same host ports (28080/28081) as ci.yml/scripts/ensure-sqld.ts for
      # consistency, though nothing here depends on that specific choice.
      - name: Start sqld
        run: |
          docker run -d --name sqld-e2e \
            -p 28080:8080 -p 28081:8081 \
            -e SQLD_NODE=primary \
            -e SQLD_ADMIN_LISTEN_ADDR='0.0.0.0:8081' \
            ghcr.io/tursodatabase/libsql-server:latest \
            /bin/sqld --enable-namespaces
          for i in $(seq 1 15); do
            curl -sf http://localhost:28080/health && break
            sleep 2
          done

      # Write a minimal .env for both apps. Secrets must be set in the repo's
      # Settings → Secrets and variables → Actions.
      # E2E_AUTH_SECRET: any stable base64 string (openssl rand -base64 32)
      # E2E_ADMIN_KEY: any string used as the sovereign admin key
      - name: Write .env
        run: |
          {
            echo "AUTH_SECRET=${{ secrets.E2E_AUTH_SECRET }}"
            echo "SOVEREIGN_AUTH_SECRET=${{ secrets.E2E_AUTH_SECRET }}"
            echo "SOVEREIGN_ADMIN_KEY=${{ secrets.E2E_ADMIN_KEY }}"
            echo "DB_DIALECT=sqlite"
            echo "SQLD_URL=http://localhost:28080"
            echo "SQLD_ADMIN_URL=http://localhost:28081"
            echo "SOVEREIGN_AUTH_URL=http://localhost:3001"
            echo "SOVEREIGN_AUTH_PUBLIC_URL=http://localhost:3001"
            echo "NEXT_PUBLIC_RUNTIME_URL=http://localhost:3000"
            echo "AUTH_INVITE_ONLY=false"
            echo "SOVEREIGN_EXAMPLES_ENABLED=true"
          } >> .env

      - name: Run Playwright tests
        run: pnpm test:e2e
        env:
          CI: 'true'

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
