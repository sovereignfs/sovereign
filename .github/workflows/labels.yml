name: Labels

# Makes the repository's labels match .github/labels.json when that file changes, and on demand (Actions -> Labels -> Run workflow).
# It makes and changes labels and never deletes one. CONTRIBUTING.md says what each is for.
on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/workflows/labels.yml
      - scripts/sync-labels.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labels
  cancel-in-progress: false

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Labels belong to issues in the API, and pull requests are issues.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The script runs under plain Node: nothing is installed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-labels.ts
