name: Promotion

# Checks the title of a promotion pull request (develop -> main) against the code it promotes, before it can be merged
# (CONTRIBUTING.md, "Promoting develop into main"): every version it names must be the one in that package.json, and a
# `Release` title may name only published things that are not tagged yet, since merging it tags and publishes them
# (release.yml). It also checks that every commit it brings has only the agent trailers AGENTS.md allows. Runs when the title is
# edited, as well as when the code changes; a draft runs nothing.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Promotion title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.draft == false && github.event.pull_request.head.ref == 'develop'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every tag, to know which versions are tagged already.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup
      - name: Check the title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: pnpm -s release:check
      # The agent trailers AGENTS.md allows, on every commit the promotion brings to main: the commit-msg hook can be missing from a
      # clone or skipped, and this check is required.
      # The repository's settings and rulesets are code (.github/repository.json); one changed in GitHub's interface fails this. What this
      # token cannot read is said and not checked; an owner's `pnpm github:apply` reads and writes it all.
      - name: Check the repository's settings are the file's
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm -s github:check

      - name: Check the commits' trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm -s commits:check "$BASE_SHA..$HEAD_SHA"
