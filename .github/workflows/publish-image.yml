name: Publish image

# Releases the image to the GitHub Container Registry when a version tag is pushed:
#   vX.Y.Z         -> ghcr.io/sovereignfs/sovereign:X.Y.Z, :X.Y and :latest
# for linux/amd64 and linux/arm64. docs/releasing.md has the whole process.
#
# Nothing publishes unless the full CI passes on the tagged commit (its `image` job boots every compose setup from the
# image), the commit is on `main`, and the tag matches the root version in package.json. It authenticates with the
# job's own GITHUB_TOKEN, so there is no secret to keep. The build uses no cache: what it publishes must not depend on
# anything another run could have stored.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

# Never two releases of one tag at once, and never cancel one that has begun publishing.
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The full validation suite, on the tagged commit.
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml

  image:
    name: Image
    runs-on: ubuntu-latest
    # arm64 is built under emulation, which is most of this.
    timeout-minutes: 90
    needs: validate
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/sovereign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Work out the version this tag releases
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="${TAG#v}"
          actual="$(node -p "require('./package.json').version")"
          if [[ ! "$expected" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The tag $TAG is not a release tag: it needs a plain X.Y.Z version." >&2
            exit 1
          fi
          if [[ "$actual" != "$expected" ]]; then
            echo "The tag $TAG expects version $expected, but package.json is $actual." >&2
            exit 1
          fi
          {
            echo "version=$actual"
            echo "minor=${actual%.*}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $actual"

      # A release is made from `main`, never from a branch that was tagged by mistake.
      - name: Check the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tagged commit is not on main; refusing to publish." >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          # What the image was built from, signed by the build and kept with it, as npm's provenance is for a package.
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.minor }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=Sovereign
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
