name: Publish Docker Images

# Publishes semver-tagged images to GHCR on every `v*.*.*` or `v*.*.*-*` tag push.
# Requires the `packages: write` permission on the GitHub token — no external
# secrets needed; GHCR uses the built-in GITHUB_TOKEN for authentication.
#
# Image names:
#   ghcr.io/<owner>/sovereign-runtime:<tag>
#   ghcr.io/<owner>/sovereign-auth:<tag>
#   ghcr.io/<owner>/sovereign-relay:<tag>
#   ghcr.io/<owner>/sovereign-tools:<tag>
#
# sovereign-relay (apps/relay, RFC 0087) is published here for two distinct
# consumers — sovereignfs's own default relay deployment, and any operator
# taking the self-host escape hatch — but unlike the other three images, it is
# NOT part of the self-hosted stack (docker-compose.yml / .prod.yml). See
# docs/rfcs/0087-sovereign-relay.md's "Deployment topology".
#
# sovereign-tools (workstream 0006 leg 1, epic task 0.19) builds the same
# Dockerfile's `tools` stage (Dockerfile:98, `AS tools`) — the on-demand `sv`
# admin CLI image `docker-compose.prod.yml`'s `tools` service runs against a
# named-volume production deployment. Before this, that service had no
# `image:` fallback, so it silently required a full source checkout to build
# locally even in a published-image-only deployment.
#
# Tags applied per release:
#   v1.2.3   — exact version
#   v1.2     — rolling minor
#   v1       — rolling major
#   latest   — rolling latest
on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: read
  packages: write

jobs:
  # Re-run the full validation suite and browser golden paths before publishing
  # any image.
  validate:
    uses: ./.github/workflows/ci.yml

  e2e:
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  build-and-push:
    name: Build and push ${{ matrix.name }}
    needs: [validate, e2e]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: sovereign-runtime
            dockerfile: Dockerfile
            target: ''
          - name: sovereign-auth
            dockerfile: apps/auth/Dockerfile
            target: ''
          - name: sovereign-relay
            dockerfile: apps/relay/Dockerfile
            target: ''
          - name: sovereign-tools
            dockerfile: Dockerfile
            target: tools

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
