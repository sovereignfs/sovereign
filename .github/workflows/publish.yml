name: Publish

# Releases a package to npm when its tag is pushed. Each published package has its own release
# cycle and its own tag:
#   ui-vX.Y.Z      -> @sovereignfs/ui
#   sdk-vX.Y.Z     -> @sovereignfs/sdk
#   manifest-vX.Y.Z -> @sovereignfs/manifest
#   config-vX.Y.Z  -> @sovereignfs/config
#   storage-vX.Y.Z -> @sovereignfs/storage
#   pwa-vX.Y.Z     -> @sovereignfs/pwa
# Every other package is private and never published (@sovereignfs/bridge is private for now;
# publishing it later means removing "private" and adding its tag and case here).
# docs/releasing.md has the whole process.
#
# The release workflow (release.yml) calls it with the tag when a `Release` promotion is merged; a tag
# pushed by hand starts it too.
#
# Nothing publishes unless the full CI passes on the tagged commit, the commit is on `main`, the
# tag matches the version in package.json, the version has a section in the package's CHANGELOG.md,
# and the packed tarball passes `pnpm packages:check`. It authenticates with the Actions secret
# NPM_TOKEN. Once published, it makes the GitHub release from that changelog section.
on:
  push:
    tags:
      - 'ui-v*.*.*'
      - 'sdk-v*.*.*'
      - 'manifest-v*.*.*'
      - 'config-v*.*.*'
      - 'storage-v*.*.*'
      - 'pwa-v*.*.*'
  workflow_call:
    inputs:
      tag:
        description: The tag to release, such as ui-v0.97.0; it exists already, on the promotion's merge commit.
        type: string
        required: true
      pr:
        description: The promotion pull request's address, named in the release notes.
        type: string
        required: false
        default: ''

permissions:
  contents: read

# Never two releases of one tag at once, and never cancel one that has begun publishing.
concurrency:
  group: publish-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # The full validation suite, on the tagged commit.
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag }}

  # The release notes, read before anything is published: a version with no changelog section is not released.
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: ./.github/actions/setup
        with:
          cache: 'false'
      - id: notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          PR: ${{ inputs.pr }}
        run: |
          if [[ -n "$PR" ]]; then pnpm -s release:notes "$TAG" --pr "$PR" > notes.md; else pnpm -s release:notes "$TAG" > notes.md; fi
          {
            echo 'body<<SOVEREIGN_NOTES_END'
            cat notes.md
            echo 'SOVEREIGN_NOTES_END'
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate, notes]
    permissions:
      contents: read
      # Lets npm sign a provenance statement: the package is shown as built from this
      # repository and this commit.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Work out which package this tag releases
        id: package
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            ui-v*) dir=ui; prefix=ui-v ;;
            sdk-v*) dir=sdk; prefix=sdk-v ;;
            manifest-v*) dir=manifest; prefix=manifest-v ;;
            config-v*) dir=config; prefix=config-v ;;
            storage-v*) dir=storage; prefix=storage-v ;;
            pwa-v*) dir=pwa; prefix=pwa-v ;;
            *) echo "The tag $TAG is not a package release tag." >&2; exit 1 ;;
          esac
          expected="${TAG#"$prefix"}"
          actual="$(node -p "require('./packages/$dir/package.json').version")"
          name="$(node -p "require('./packages/$dir/package.json').name")"
          if [[ "$actual" != "$expected" ]]; then
            echo "The tag $TAG expects $name@$expected, but packages/$dir/package.json is $actual." >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Releasing $name@$actual"

      # A release is made from `main`, never from a branch that was tagged by mistake.
      - name: Check the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "The tagged commit is not on main; refusing to publish." >&2
            exit 1
          fi

      - uses: ./.github/actions/setup
        with:
          cache: 'false'
      # A second setup-node, with the registry, writes the .npmrc that reads NODE_AUTH_TOKEN.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: pnpm build
      - run: pnpm packages:check

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE: ${{ steps.package.outputs.name }}
        run: pnpm --filter "$PACKAGE" publish --no-git-checks --access public --provenance

  # The GitHub release for the tag, with the changelog section as its notes. Run again, it replaces the notes.
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [publish, notes]
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          BODY: ${{ needs.notes.outputs.body }}
        run: |
          printf '%s\n' "$BODY" > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file notes.md
          fi
