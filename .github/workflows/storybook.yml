name: Storybook

# Builds the design system's Storybook here and publishes it to the dedicated repository
# sovereignfs/storybook, whose GitHub Pages serves https://sovereignfs.github.io/storybook/.
# It runs when a `sb-v*` tag is pushed (the tag need not match a package version; it marks the
# commit to put live) or when started by hand.
#
# It authenticates with the Actions secret STORYBOOK_DEPLOY_TOKEN: a personal access token that
# can write to sovereignfs/storybook (fine-grained: Contents read and write on that one
# repository). It expires, so renew it when a deploy starts failing with an authentication error.

on:
  push:
    tags: ['sb-v*']
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a running one is never cancelled half way through a push.
concurrency:
  group: storybook-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the deploy token is configured
        env:
          DEPLOY_TOKEN: ${{ secrets.STORYBOOK_DEPLOY_TOKEN }}
        run: |
          if [[ -z "$DEPLOY_TOKEN" ]]; then
            echo "The secret STORYBOOK_DEPLOY_TOKEN is not set; see the note at the top of this workflow." >&2
            exit 1
          fi

      - uses: ./.github/actions/setup
      - run: pnpm build-storybook

      - name: Publish to sovereignfs/storybook
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.STORYBOOK_DEPLOY_TOKEN }}
          external_repository: sovereignfs/storybook
          publish_branch: gh-pages
          publish_dir: packages/ui/storybook-static
          commit_message: 'deploy: storybook from ${{ github.sha }}'
