name: Storybook

# Builds the design system's Storybook here and publishes it to the dedicated repository
# sovereignfs/storybook, whose GitHub Pages serves https://sovereignfs.github.io/storybook/.
# It runs when a `sb-v*` tag is pushed (the tag need not match a package version; it marks the
# commit to put live) or when started by hand.
#
# One-time setup, by an owner of both repositories (nothing in this repository's own settings):
#   1. Generate a key pair:  ssh-keygen -t ed25519 -N '' -C storybook-deploy -f storybook-deploy
#   2. Add storybook-deploy.pub to sovereignfs/storybook as a deploy key with write access.
#   3. Add the private key to this repository as the Actions secret STORYBOOK_DEPLOY_KEY.
# The key can write to that one repository and nothing else.

on:
  push:
    tags: ['sb-v*']
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a running one is never cancelled half way through a push.
concurrency:
  group: storybook-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the deploy key is configured
        env:
          DEPLOY_KEY: ${{ secrets.STORYBOOK_DEPLOY_KEY }}
        run: |
          if [[ -z "$DEPLOY_KEY" ]]; then
            echo "The secret STORYBOOK_DEPLOY_KEY is not set; see the setup steps at the top of this workflow." >&2
            exit 1
          fi

      - uses: ./.github/actions/setup
      - run: pnpm build-storybook

      - name: Publish to sovereignfs/storybook
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          deploy_key: ${{ secrets.STORYBOOK_DEPLOY_KEY }}
          external_repository: sovereignfs/storybook
          publish_branch: gh-pages
          publish_dir: packages/ui/storybook-static
          commit_message: 'deploy: storybook from ${{ github.sha }}'
