name: Storybook

# Publishes the design system's Storybook to GitHub Pages from this repository. It runs when a
# `sb-v*` tag is pushed (the tag need not match a package version; it marks the commit to put
# live) or when started by hand. Pages must be enabled for the repository with the source set
# to "GitHub Actions" (Settings > Pages); the workflow cannot do that itself.
#
# Live at https://sovereignfs.github.io/sovereign-core/

on:
  push:
    tags: ['sb-v*']
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and a newer one replaces a queued older one without cancelling
# a running one half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build-storybook
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/ui/storybook-static

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
