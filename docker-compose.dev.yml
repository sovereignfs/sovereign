# What development needs and nothing else: a persistent sqld, on the ports core's tests and `pnpm dev` expect
# (8080 and 8081). `pnpm dev` starts it when apps/core/.env chooses sqld (scripts/dev.ts). Core itself runs from
# source (`next dev`), not from this file.
name: sovereign-core-dev

services:
  sqld:
    image: ghcr.io/tursodatabase/libsql-server:v0.24.33
    restart: unless-stopped
    command: ['/bin/sqld', '--enable-namespaces']
    environment:
      SQLD_NODE: primary
      SQLD_HTTP_LISTEN_ADDR: 0.0.0.0:8080
      SQLD_ADMIN_LISTEN_ADDR: 0.0.0.0:8081
    ports:
      - '127.0.0.1:8080:8080'
      - '127.0.0.1:8081:8081'
    volumes:
      - sqld-dev-data:/var/lib/sqld
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200'"
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  sqld-dev-data:
