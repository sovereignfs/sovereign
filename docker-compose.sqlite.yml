# One container, a SQLite file: the smallest way to run core, for one person or a small group on one machine.
#
#   docker compose -f docker-compose.sqlite.yml up -d
#
# The database is a file in the `core-data` volume, so back it up by copying that volume (or the file) while core is
# stopped, or with `sqlite3 core.db ".backup"`. It cannot be shared by more than one core, so use sqld or PostgreSQL
# for anything bigger. See docker-compose.yml for the rest (the address, the secret, the hairpin note).
name: sovereign

services:
  core:
    image: ${SV_IMAGE:-ghcr.io/sovereignfs/sovereign:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '${SV_PORT:-3000}:3000'
    env_file:
      - path: .env
        required: false
    environment:
      SV_URL: ${SV_URL:?Set SV_URL to the public address of core, for example https://core.sovereign.local}
      SV_AUTH_SECRET: ${SV_AUTH_SECRET:?Set SV_AUTH_SECRET to a long random secret (openssl rand -base64 48)}
      SV_DB_DIALECT: sqlite
      SV_SQLITE_URL: file:/data/core.db
    volumes:
      - core-data:/data

volumes:
  core-data:
