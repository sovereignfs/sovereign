# Local development services.
#
# Runs Mailpit (email capture), sqld (SQLite is always sqld-backed — see
# docs/self-hosting.md's sqld section), the auth server, and the runtime
# together on a shared internal network. See docs/self-hosting.md for setup
# instructions.
#
# For active code development (hot-reload), use `pnpm dev` instead. This file
# is for spinning up the full containerised stack locally.
#
# Quick start:
#   cp .env.example .env          # fill in AUTH_SECRET at minimum
#   docker compose up --build
services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: sovereign-mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025' # SMTP endpoint the app sends to
      - '${MAILPIT_UI_PORT:-8025}:8025' # web inbox — open http://localhost:8025
    environment:
      # Accept mail without auth/TLS so the dev app can send freely.
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    networks:
      - sovereign_net

  sqld:
    image: ghcr.io/tursodatabase/libsql-server:latest
    container_name: sovereign-sqld
    restart: unless-stopped
    # --enable-namespaces has no env-var equivalent (confirmed against
    # libsql-server's own CLI definitions) — must be a command-line arg.
    # Namespaces give each isolated plugin database (and the auth database)
    # its own logical database within this one sqld instance
    # (packages/db/src/sqld.ts's x-namespace header), the sqld analogue of
    # Postgres's per-plugin/per-auth schema.
    command: ['/bin/sqld', '--enable-namespaces']
    environment:
      SQLD_NODE: primary
      SQLD_ADMIN_LISTEN_ADDR: '0.0.0.0:8081'
    volumes:
      - sovereign_sqld_data:/var/lib/sqld
    healthcheck:
      # No wget/curl in ghcr.io/tursodatabase/libsql-server (debian:bullseye-slim,
      # confirmed empty by testing this exact image) — bash's /dev/tcp pseudo-device
      # needs nothing external, and bash is present.
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -1 <&3 | grep -q "200 OK"',
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - sovereign_net

  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    container_name: sovereign-auth
    # The production image runs as a non-root user; here we override to root so
    # writes to the host `./data` bind mount work regardless of host ownership.
    # (Prod uses a named volume instead and keeps the non-root user.)
    user: root
    # Exposed to the host so the browser can reach the auth app's compatibility
    # routes directly. Runtime-hosted auth UI talks to this service through
    # SOVEREIGN_AUTH_URL=http://auth:3001. Dev-only: production keeps auth
    # internal (docker-compose.prod.yml uses expose, not ports).
    ports:
      - '${AUTH_PORT:-3001}:3001'
    environment:
      AUTH_SECRET: '${AUTH_SECRET}'
      # DB_DIALECT is the sole source of truth (no per-service override) —
      # auth reads the exact same value the runtime does, so the two can
      # never disagree. Postgres additionally needs POSTGRES_DB_URL (see
      # docker-compose.postgres.yml); SQLite needs nothing else here — it's
      # always sqld-backed (SQLD_URL/SQLD_ADMIN_URL below).
      DB_DIALECT: '${DB_DIALECT:-sqlite}'
      SQLD_URL: 'http://sqld:8080'
      SQLD_ADMIN_URL: 'http://sqld:8081'
      AUTH_INVITE_ONLY: '${AUTH_INVITE_ONLY:-false}'
      AUTH_REQUIRE_EMAIL_VERIFICATION: '${AUTH_REQUIRE_EMAIL_VERIFICATION:-true}'
      # better-auth base URL — must be the browser-reachable address so
      # callback and cookie URLs resolve in the browser after login.
      AUTH_BASE_URL: '${AUTH_BASE_URL:-http://localhost:3001}'
      # Internal Docker service address trusted for server-to-server CSRF checks.
      # The runtime sends Origin: http://auth:3001 for internal calls; adding it
      # here ensures those calls are accepted even when AUTH_BASE_URL is the
      # public domain.
      AUTH_TRUSTED_ORIGINS: '${AUTH_TRUSTED_ORIGINS:-http://auth:3001}'
      NEXT_PUBLIC_RUNTIME_URL: '${NEXT_PUBLIC_RUNTIME_URL:-http://localhost:3000}'
      SOVEREIGN_ADMIN_KEY: '${SOVEREIGN_ADMIN_KEY}'
      # Only needed once SMTP is configured via Console with a password
      # (Email delivery settings) — the auth server decrypts its own local
      # copy independently of the runtime. Same key as the runtime's vault.
      SOVEREIGN_VAULT_KEY: '${SOVEREIGN_VAULT_KEY}'
      # Internal Docker service address for auth→runtime server-to-server calls
      # (e.g. recording email-delivery-failure activity log entries). Mirrors
      # SOVEREIGN_AUTH_URL on the runtime service below, reversed.
      SOVEREIGN_RUNTIME_URL: 'http://runtime:3000'
    volumes:
      - ./data:/app/data
    depends_on:
      sqld:
        condition: service_healthy
    networks:
      - sovereign_net

  runtime:
    build:
      context: .
      dockerfile: Dockerfile
      # Build-time inclusion of example-plugins/ (docs/epics/example-plugins.md) —
      # distinct from the SOVEREIGN_EXAMPLES_ENABLED runtime env var below,
      # which only controls visibility of whatever this build actually
      # composed. Off by default; reuses the same var name deliberately (see
      # the Dockerfile's builder stage comment) so setting it once in .env
      # both builds the examples in and shows them.
      args:
        SOVEREIGN_EXAMPLES_ENABLED: '${SOVEREIGN_EXAMPLES_ENABLED:-0}'
    container_name: sovereign-runtime
    # See the auth service: root override so the host `./data` bind mount is
    # writable. Prod (docker-compose.prod.yml) keeps the image's non-root user.
    user: root
    ports:
      - '${RUNTIME_PORT:-3000}:3000'
    environment:
      # Overrides the .env value (which points to localhost for native dev).
      # Inside Docker, the runtime reaches auth via the internal service name.
      SOVEREIGN_AUTH_URL: 'http://auth:3001'
      # Browser-facing URL for auth-server compatibility routes. Differs from
      # SOVEREIGN_AUTH_URL because browsers can't resolve the internal service
      # name "auth". Defaults to localhost in dev; set to your auth public
      # domain in production when compatibility routes need to be reachable.
      SOVEREIGN_AUTH_PUBLIC_URL: '${SOVEREIGN_AUTH_PUBLIC_URL:-http://localhost:3001}'
      SOVEREIGN_ADMIN_KEY: '${SOVEREIGN_ADMIN_KEY}'
      # Shared signing secret — the runtime verifies the auth server's session
      # cookie locally with it (SRS AUTH-05); must match the auth service.
      AUTH_SECRET: '${AUTH_SECRET}'
      NEXT_PUBLIC_RUNTIME_URL: '${NEXT_PUBLIC_RUNTIME_URL:-http://localhost:3000}'
      DB_DIALECT: '${DB_DIALECT:-sqlite}'
      SQLD_URL: 'http://sqld:8080'
      SQLD_ADMIN_URL: 'http://sqld:8081'
      # Show the bundled example/demo apps (hidden by default). See .env.example.
      SOVEREIGN_EXAMPLES_ENABLED: '${SOVEREIGN_EXAMPLES_ENABLED:-}'
      # Hide plugins flagged development: true (shown by default). See .env.example.
      SOVEREIGN_HIDE_DEVELOPMENT_PLUGINS: '${SOVEREIGN_HIDE_DEVELOPMENT_PLUGINS:-}'
      # App-level field encryption (RFC 0092) — both empty by default (off).
      # Policy without key fails startup loudly; see .env.example.
      SOVEREIGN_ENCRYPT_CLASSES: '${SOVEREIGN_ENCRYPT_CLASSES:-}'
      SOVEREIGN_FIELD_KEK: '${SOVEREIGN_FIELD_KEK:-}'
      # Email routes to the Mailpit service on the internal network.
      SMTP_HOST: mailpit
      SMTP_PORT: '${MAILPIT_SMTP_PORT:-1025}'
      SMTP_USER: '${SMTP_USER:-}'
      SMTP_PASS: '${SMTP_PASS:-}'
      SMTP_FROM: '${SMTP_FROM:-Sovereign <dev@localhost>}'
    volumes:
      - ./data:/app/data
    depends_on:
      - auth
      - mailpit
    networks:
      - sovereign_net

volumes:
  sovereign_sqld_data:
    name: sovereign_sqld_data

networks:
  sovereign_net:
    driver: bridge
