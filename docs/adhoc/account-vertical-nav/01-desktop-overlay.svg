<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- page behind the overlay -->
  <rect x="0" y="0" width="1000" height="700" fill="#f2f2f2"/>
  <rect x="0" y="0" width="1000" height="56" fill="#ffffff" stroke="#e2e2e2"/>
  <circle cx="954" cy="28" r="14" fill="#cfcfcf"/>
  <text x="954" y="32" font-size="11" fill="#616161" text-anchor="middle">JL</text>

  <!-- scrim -->
  <rect x="0" y="0" width="1000" height="700" fill="#1a1a1a" fill-opacity="0.45"/>

  <!-- dialog panel: overlaySize "md", shell stays "overlay" -->
  <rect x="70" y="70" width="860" height="560" rx="16" fill="#ffffff" stroke="#dcdcdc" filter="url(#shadow)"/>

  <!-- close control -->
  <circle cx="900" cy="102" r="14" fill="#f0f0f0"/>
  <text x="900" y="107" font-size="14" fill="#5a5a5a" text-anchor="middle">&#215;</text>

  <!-- compact title above the rail column only -->
  <text x="102" y="118" font-size="22" font-weight="700" fill="#1a1a1a">Account</text>

  <!-- rail / content divider -->
  <line x1="326" y1="146" x2="326" y2="606" stroke="#e6e6e6" stroke-width="1"/>

  <!-- ===== rail (NavList, variant=static) ===== -->
  <!-- active row: Profile -->
  <rect x="102" y="154" width="200" height="40" rx="8" fill="#eef0f2"/>
  <g stroke="#1a1a1a" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="123" cy="169" r="5.5"/>
    <path d="M114 184 a9 8 0 0 1 18 0"/>
  </g>
  <text x="146" y="179" font-size="14" font-weight="600" fill="#1a1a1a">Profile</text>

  <!-- Security -->
  <g stroke="#6b6b6b" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M123 203 l9 3.5 v9 c0 7 -4.5 11.5 -9 13.5 c-4.5 -2 -9 -6.5 -9 -13.5 v-9 z"/>
  </g>
  <text x="146" y="227" font-size="14" fill="#5a5a5a">Security</text>

  <!-- Preferences -->
  <g stroke="#6b6b6b" stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="114" y1="251" x2="132" y2="251"/>
    <circle cx="126" cy="251" r="2.4" fill="#6b6b6b" stroke="none"/>
    <line x1="114" y1="257" x2="132" y2="257"/>
    <circle cx="119" cy="257" r="2.4" fill="#6b6b6b" stroke="none"/>
    <line x1="114" y1="263" x2="132" y2="263"/>
    <circle cx="123" cy="263" r="2.4" fill="#6b6b6b" stroke="none"/>
  </g>
  <text x="146" y="275" font-size="14" fill="#5a5a5a">Preferences</text>

  <!-- Notifications -->
  <g stroke="#6b6b6b" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M123 299.5 a7 7 0 0 1 7 7 v4 l2.5 4.5 h-19 l2.5 -4.5 v-4 a7 7 0 0 1 7 -7 z"/>
    <path d="M120.5 317 a2.7 2.7 0 0 0 5 0"/>
  </g>
  <text x="146" y="323" font-size="14" fill="#5a5a5a">Notifications</text>

  <!-- Billing -->
  <g stroke="#6b6b6b" stroke-width="1.5" fill="none" stroke-linejoin="round">
    <rect x="113" y="340" width="20" height="14" rx="2.5"/>
    <line x1="113" y1="345.5" x2="133" y2="345.5"/>
  </g>
  <text x="146" y="371" font-size="14" fill="#5a5a5a">Billing</text>

  <!-- Data -->
  <g stroke="#6b6b6b" stroke-width="1.5" fill="none" stroke-linejoin="round">
    <rect x="117" y="391" width="12" height="10" rx="1.5"/>
    <path d="M119.5 391 v-3.5 a3.5 3.5 0 0 1 7 0 v3.5"/>
  </g>
  <text x="146" y="419" font-size="14" fill="#5a5a5a">Data</text>

  <!-- Activity -->
  <g stroke="#6b6b6b" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="123" cy="443" r="9"/>
    <path d="M123 438 v5.5 l4.5 2.5"/>
  </g>
  <text x="146" y="467" font-size="14" fill="#5a5a5a">Activity</text>

  <!-- ===== content pane: active section = Profile ===== -->
  <text x="350" y="176" font-size="20" font-weight="600" fill="#1a1a1a">Profile</text>

  <!-- Avatar sub-section -->
  <text x="350" y="216" font-size="13" font-weight="600" fill="#5a5a5a">Avatar</text>
  <circle cx="378" cy="256" r="28" fill="#e4e4e4"/>
  <text x="378" y="261" font-size="14" fill="#7a7a7a" text-anchor="middle">JL</text>
  <rect x="424" y="242" width="128" height="32" rx="6" fill="#ffffff" stroke="#d6d6d6"/>
  <text x="488" y="262" font-size="13" fill="#3a3a3a" text-anchor="middle">Change avatar</text>

  <!-- Display name sub-section -->
  <text x="350" y="318" font-size="13" font-weight="600" fill="#5a5a5a">Display name</text>
  <rect x="350" y="330" width="380" height="36" rx="6" fill="#ffffff" stroke="#d6d6d6"/>
  <text x="362" y="353" font-size="14" fill="#1a1a1a">Jordan Lee</text>

  <!-- Email sub-section -->
  <text x="350" y="392" font-size="13" font-weight="600" fill="#5a5a5a">Email</text>
  <rect x="350" y="404" width="380" height="36" rx="6" fill="#ffffff" stroke="#d6d6d6"/>
  <text x="362" y="427" font-size="14" fill="#1a1a1a">jordan@example.com</text>

  <!-- Save -->
  <rect x="350" y="468" width="128" height="36" rx="6" fill="#1a1a1a"/>
  <text x="414" y="491" font-size="13" fill="#ffffff" text-anchor="middle">Save changes</text>

  <!-- caption -->
  <text x="70" y="654" font-size="12" fill="#8a8a8a">Desktop · shell: "overlay", resized overlaySize "md" · rail = NavList (variant="static") · content pane unchanged per section</text>
</svg>
