packages:
  - 'apps/*'
  - 'packages/*'
  - 'plugins/*'
  - 'example-plugins/*'
  - 'runtime'

# Keep native dependencies such as better-sqlite3 compiled against the same
# Node ABI used by dev and production. Docker uses node:24-alpine.
engineStrict: true
useNodeVersion: 24.12.0

# Without this, pnpm only bakes optional-dependency variants for the *host*
# platform running `pnpm install` into the lockfile — not the platform(s)
# the lockfile will actually be installed on later. That silently broke
# apps/auth's Docker image: the lockfile is generated on contributors'
# darwin/arm64 machines, but the image runs on node:24-alpine (linux/musl)
# inside Docker Desktop's native linux/arm64 build target. libsql/@libsql's
# own package.json declares no `libc` field at all, so pnpm can't tell
# glibc from musl by package metadata alone — the platform-specific package
# *names* (`@libsql/linux-arm64-musl` vs `-gnu`) are the only signal, and
# without a supportedArchitectures entry naming musl, the lockfile never
# records that variant as needed, so a `--frozen-lockfile` install inside
# the Alpine container has nothing to install regardless of the container's
# actual libc. `apps/auth/instrumentation.ts`'s eager `runAuthMigrations()`
# then crashes at boot with `Cannot find module '@libsql/linux-arm64-musl'`
# — reproduced (and confirmed pre-existing, unrelated to any single recent
# change) by building apps/auth/Dockerfile from a commit weeks before this
# fix and hitting the identical crash. Covers every real target this repo
# ships to: contributors' darwin/arm64 dev machines, CI's linux/x64 glibc
# runners, and node:24-alpine's linux/arm64 (Apple Silicon Docker Desktop)
# and linux/x64 (most cloud hosts) musl targets.
supportedArchitectures:
  os:
    - darwin
    - linux
  cpu:
    - arm64
    - x64
  libc:
    - glibc
    - musl

# Single source of truth for shared dev tooling versions. Packages reference
# these with `"typescript": "catalog:"` etc. so a `pnpm add` can never float one
# package onto a different major. Add a dep here when it is used by more than one
# package (the toolchain), not for package-specific deps (zod, drizzle, …).
catalog:
  typescript: ^5.9.3
  tsup: ^8.5.1
  '@playwright/test': ^1.62.1
  react: ^19.2.8
  react-dom: ^19.2.8
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@types/node': ^22.20.1
  next: ^15.5.22
  semver: ^7.8.5
  '@types/semver': ^7.8.0
  # Client-component testing — shared by packages/ui and any plugin with its
  # own client components (first cross-consumer: plugins/warden's ChatView).
  '@testing-library/react': ^16.3.2
  '@testing-library/dom': ^10.4.1
  # SQLCipher-capable fork of better-sqlite3 (RFC 0071) — API-compatible
  # drop-in, same major/version line as better-sqlite3. Used by packages/db,
  # apps/auth, and scripts/ wherever a SQLite file is opened directly.
  better-sqlite3-multiple-ciphers: ^12.11.1

# Forced transitive resolutions for dependencies we don't control directly.
# nanoid: GHSA-2v37-7h3g-55p8 (custom generators looping indefinitely on
# size: 0) — pulled in four levels deep via next > postcss > nanoid, not
# something a catalog bump of next alone resolves since postcss's own nanoid
# dependency isn't independently pinned by us. Forces every resolution in
# the tree to the patched line rather than adding an ignoreGhsas exception,
# since a real fix is available and low-risk (nanoid patch releases are
# tiny, ID-generation-only).
overrides:
  nanoid: '>=3.3.18'

# Transitive deps allowed to run install scripts (pnpm blocks them by default).
# esbuild (via tsx) needs its postinstall to link the platform binary.
# better-sqlite3-multiple-ciphers needs its postinstall to fetch/compile the
# native binding (RFC 0071). Plain better-sqlite3 still resolves as an optional
# peer of drizzle-orm's better-sqlite3 adapter and better-auth's drizzle
# adapter (type-only reference) but nothing in this repo constructs an
# instance from it anymore — its native build is declined.
# simple-git-hooks: declined — the root `prepare` script installs the git hooks
# explicitly, so the dependency's own postinstall is redundant.
catalogs:
  # Storybook — used exclusively by packages/ui. All addon versions must
  # stay in lock-step with the storybook core version.
  storybook:
    storybook: ^10.5.5
    '@storybook/react-vite': ^10.5.5
    '@storybook/addon-a11y': ^10.5.5
    '@storybook/addon-themes': ^10.5.5
    # @storybook/addon-viewport was absorbed into the storybook core package in v9+.
    # Use parameters.viewport in preview.ts; no separate addon needed.
    # @storybook/test was similarly absorbed; import from 'storybook/test' instead.

allowBuilds:
  better-sqlite3: false
  better-sqlite3-multiple-ciphers: true
  esbuild: true
  sharp: false
  simple-git-hooks: false
auditConfig:
  ignoreGhsas:
    - GHSA-p6gq-j5cr-w38f
    - GHSA-p2fr-6hmx-4528
    - GHSA-f88m-g3jw-g9cj
    - GHSA-6g55-p6wh-862q
    - GHSA-r28c-9q8g-f849
    - GHSA-5c6j-r48x-rmvq
