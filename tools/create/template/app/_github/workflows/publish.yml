name: Publish

# Builds this app's image when a version tag is pushed, and publishes it to GitHub's container registry as ghcr.io/<owner>/<repository>
# tagged X.Y.Z, which is where `sv app add --git` looks for it (operator-cli §4.2.1):
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The image carries the manifest as its label and is built to listen on the manifest's port, both made from sovereign.manifest.json by
# @sovereignfs/manifest, so the manifest is written once.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund

      # The tag names the version, so it has to be the one the package says. The image is tagged X.Y.Z, without the v.
      - id: version
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(node -p "require('./package.json').version")"
          if [ "$actual" != "$expected" ]; then
            echo "The tag $GITHUB_REF_NAME expects version $expected, but package.json says $actual." >&2
            exit 1
          fi
          echo "version=$expected" >> "$GITHUB_OUTPUT"

      # Fails the build on a manifest an instance would refuse.
      - run: npx sovereign-manifest check

      - id: manifest
        run: npx sovereign-manifest docker-args --format github >> "$GITHUB_OUTPUT"

      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
          labels: ${{ steps.manifest.outputs.labels }}
          build-args: ${{ steps.manifest.outputs.build-args }}
