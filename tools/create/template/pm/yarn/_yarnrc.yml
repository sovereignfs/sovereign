# Yarn's settings for this app. Its packages go in node_modules, as Next's standalone build and the image expect, not in Plug'n'Play.
nodeLinker: node-modules
enableTelemetry: false
# Yarn records only the host's builds of a package with native code (libsql's) unless told which others the app runs on: the image's
# Alpine (musl) among them.
supportedArchitectures:
  os: [darwin, linux]
  cpu: [arm64, x64]
  libc: [glibc, musl]
